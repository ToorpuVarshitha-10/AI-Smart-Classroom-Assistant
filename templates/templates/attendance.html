<!DOCTYPE html>
<html>
<body>

<h1>Attendance System</h1>

<form method="POST">
    <input type="text" name="student_name" placeholder="Student Name" required>
    <br><br>

    <select name="status">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
    </select>

    <br><br>

    <button type="submit">Save Attendance</button>
</form>

</body>
</html>
