<!DOCTYPE html>
<html>
<body>

<h1>Attendance List</h1>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Date & Time</th>
    </tr>

    {% for row in data %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
