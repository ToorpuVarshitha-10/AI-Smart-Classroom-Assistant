<!DOCTYPE html>
<html>
<head>
    <title>AI Smart Classroom Assistant</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            text-align:center;
        }

        h1{
            color:#0d6efd;
            margin-top:30px;
        }

        .card{
            width:250px;
            background:white;
            padding:20px;
            margin:20px;
            display:inline-block;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        button{
            width:180px;
            padding:10px;
            font-size:16px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#084298;
        }

    </style>

</head>

<body>

<h1>🎓 AI Smart Classroom Assistant</h1>

<div class="card">
<h2>👨 Attendance</h2>
<button onclick="location.href='/attendance'">Open</button>
</div>

<div class="card">
<h2>🎤 Upload Lecture</h2>
<button onclick="location.href='/upload_audio'">Open</button>
</div>

<div class="card">
<h2>📋 View Attendance</h2>
<button onclick="location.href='/view'">Open</button>
</div>

<div class="card">
<h2>📄 Download Notes</h2>
<button onclick="location.href='/download_notes'">Open</button>
</div>

<div class="card">
<h2>🚪 Logout</h2>
<button onclick="location.href='/logout'">Logout</button>
</div>

</body>
</html>
